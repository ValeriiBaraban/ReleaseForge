name: Deploy Backend to EC2

on:
  push:
    branches: 
      - "main"
      - "dev"
    paths:
      - 'backend/**'
      - '.github/workflows/development_back.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Fetch Secrets from SSM
        id: fetch-secrets
        run: |
          DYNAMIC_URI=$(aws ssm get-parameter --name "/releaseforge/backend/mongo_uri" --with-decryption --query "Parameter.Value" --output text)
          DYNAMIC_IP=$(aws ssm get-parameter --name "/releaseforge/backend/ec2_public_ip" --query "Parameter.Value" --output text)
          
          echo "::add-mask::$DYNAMIC_URI"
          
          echo "MONGO_URI=$DYNAMIC_URI" >> $GITHUB_ENV
          echo "EC2_HOST=$DYNAMIC_IP" >> $GITHUB_ENV

          aws ssm get-parameter --name "/releaseforge/backend/ec2_private_key" --with-decryption --query "Parameter.Value" --output text > private_key.pem
          chmod 644 private_key.pem

      - name: Copy backend files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: "private_key.pem" 
          source: "backend"
          target: "~/app"
          strip_components: 1 

      - name: Build and Run Docker containers (Backend + Nginx)
        uses: appleboy/ssh-action@v1.0.3
        env:
          MONGO_URI: ${{ env.MONGO_URI }}
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: "private_key.pem"
          envs: MONGO_URI
          script: |
            cd ~/app
            
            echo "PORT=8080" > .env
            echo "MONGO_URI=$MONGO_URI" >> .env
            
            cat << 'EOF' > nginx.conf
            server {
                listen 80;
                
                add_header X-Frame-Options "SAMEORIGIN";
                add_header X-XSS-Protection "1; mode=block";
                add_header X-Content-Type-Options "nosniff";
                
                location /api/ {
                    proxy_pass http://backend-server:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            EOF
            
            sudo docker network inspect releaseforge-net >/dev/null 2>&1 || sudo docker network create releaseforge-net
            
            sudo docker stop backend-server nginx-server || true
            sudo docker rm backend-server nginx-server || true
            
            sudo docker build -t backend-server .
            sudo docker run -d --name backend-server --network releaseforge-net --env-file .env backend-server
            
            sudo docker run -d --name nginx-server --network releaseforge-net -p 80:80 -v $(pwd)/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
      - name: Cleanup
        if: always()
        run: rm -f private_key.pem