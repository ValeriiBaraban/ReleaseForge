name: Deploy static site to S3

on:
  push:
    branches: 
      - "main"
      - "dev"
    paths:
      - 'frontend/**'
      - '.github/workflows/development_front.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build project
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: https://projectsummer.click

      - name: Debug context
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Sync site/ to S3 to \site/
        run: |
           aws s3 sync frontend/dist s3://dev-projectsummer.click/ --delete
      # - name: Invalidate CloudFront cache
      #   run: |
      #      aws cloudfront create-invalidation \
      #       --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
      #       --paths "/*"
      - name: Invalidate CloudFront Cache
        env:
          AWS_DEFAULT_REGION: us-west-2
        run: |
          DIST_ID=$(aws ssm get-parameter --name "/projectsummer/frontend/cloudfront_id" --query "Parameter.Value" --output text)
          
          echo "Distribution ID: $DIST_ID"
          
          # 2. Invalidate CloudFront cache with the retrieved ID
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --paths "/*"   